version: 2
updates:

# GitHub Actions used in the workflows.  All updates are collected in
# one PR per week.
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:30"
  groups:
    github-actions:
      patterns: ["*"]
  labels:
    - CI/CD
    - skip_changelog

# Python dependencies in pyproject.toml.  The version ranges are only
# widened when a new release falls outside them.  All updates are
# collected in one PR per week.
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:30"
  versioning-strategy: increase-if-necessary
  groups:
    python-dependencies:
      patterns: ["*"]
  labels:
    - CI/CD
    - skip_changelog
