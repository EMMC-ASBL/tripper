name: CD - Publish

on:
  release:
    types:
    - published

jobs:
  build:
    name: Build distribution package
    if: github.repository == 'EMMC-ASBL/tripper' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Install flit
      run: uv pip install --system flit

    # The version is taken from the release tag (e.g. v1.2.3 -> 1.2.3)
    # and not committed back to the repository.
    - name: Set version from tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        sed -i -E "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" tripper/__init__.py
        grep -q "^__version__ = \"${VERSION}\"$" tripper/__init__.py

    - name: Build distribution package
      run: flit build

    - name: Upload distribution package
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist
        if-no-files-found: error

  release-notes:
    name: Add generated release notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Append GitHub's generated release notes (configured in
    # .github/release.yml) to the release description, e.g. a release
    # summary.  Skipped if the notes were already generated when the
    # release was created ("Generate release notes" button), which is
    # recognised by the "Full Changelog" line they end with.
    steps:
    - name: Add generated release notes
      if: ${{ ! contains(github.event.release.body, '**Full Changelog**') }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .body > body.md
        if [ -s body.md ]; then printf '\n\n' >> body.md; fi
        gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
          -f tag_name="${GITHUB_REF_NAME}" --jq .body >> body.md
        gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
          -X PATCH -F body=@body.md >/dev/null
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ github.event.release.id }}

  publish:
    name: Publish on PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/project/tripper/
    permissions:
      id-token: write

    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: Deploy release documentation
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # mike needs the gh-pages branch

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv pip install --system -e .[dev]

    - name: Set version from tag
      run: |
        sed -i -E "s/^__version__ = \".*\"/__version__ = \"${GITHUB_REF_NAME#v}\"/" tripper/__init__.py

    # See the docs job in ci_tests.yml
    - name: Update API reference and landing page
      run: |
        for hook in docs-api-reference docs-landing-page; do
          pre-commit run "$hook" --all-files \
            || pre-commit run "$hook" --all-files
        done

    - name: Set up git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # Deploy the documentation for this version, with the alias "stable"
    - name: Deploy documentation
      run: |
        mike deploy --push --remote origin --branch gh-pages \
          --update-aliases --config-file mkdocs.yml \
          "${GITHUB_REF_NAME#v}" stable
