name: CI/CD - New updates to 'master'

on:
  push:
    branches: [master]

# Deploy one push at a time, such that mike doesn't push concurrently
# to gh-pages
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy `latest` documentation
    if: github.repository_owner == 'EMMC-ASBL'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # mike needs the gh-pages branch

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv pip install --system -e .[dev]

    # See the docs job in ci_tests.yml
    - name: Update API reference and landing page
      run: |
        for hook in docs-api-reference docs-landing-page; do
          pre-commit run "$hook" --all-files \
            || pre-commit run "$hook" --all-files
        done

    - name: Set up git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # Deploy the documentation of master as "latest", with the alias "master"
    - name: Deploy documentation
      run: |
        mike deploy --push --remote origin --branch gh-pages \
          --update-aliases --config-file mkdocs.yml latest master
