name: CI - Tests

on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'push-action/**'  # Allow pushing to protected branches

# Cancel superseded runs on the same PR/branch (but never on master)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  basic-tests:
    name: External
    uses: SINTEF/ci-cd/.github/workflows/ci_tests.yml@v2.10.0
    with:
      ## General settings:
      install_extras: "[dev]"

      ## pre-commit
      run_pre-commit: false
      skip_pre-commit_hooks: "generate-context-and-doc"

      ## pylint & safety
      python_version_pylint_safety: "3.14"

      # pylint-specific settings
      run_pylint: true
      pylint_runs: |
        --rcfile=pyproject.toml tripper
        --rcfile=pyproject.toml --disable=import-outside-toplevel,redefined-outer-name tests

      # safety-specific settings
      run_safety: false

      ## Build package
      run_build_package: true
      python_version_package: "3.14"
      build_libs: flit
      build_cmd: flit build

      ## Build documentation
      run_build_docs: true
      python_version_docs: "3.14"
      warnings_as_errors: true
      use_mkdocs: true

      # mkdocs-specific settings
      update_python_api_ref: true
      update_docs_landing_page: true
      package_dirs: tripper

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Run Safety CLI to check for vulnerabilities
        uses: pyupio/safety-action@v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY2 }}
          args: --detailed-output # To always see detailed output from this action

  pytest:
    runs-on: ubuntu-latest


    services:
      fuseki:
        image: stain/jena-fuseki
        env:
          ADMIN_PASSWORD: admin0
          FUSEKI_DATASET_1: test_repo
        ports:
          - 3030:3030
        options: >-
          --health-cmd "curl -f http://localhost:3030 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv pip install --system -e .[testing]

    - name: List installed packages
      run: uv pip freeze --system

    # The tripper cache holds e.g. the units table generated from EMMO,
    # which otherwise is downloaded and rebuilt in every job.
    - name: Cache tripper data
      uses: actions/cache@v6
      with:
        path: ~/.cache/tripper
        key: tripper-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tripper/units/**', 'tripper/context/**', 'pyproject.toml') }}

    # Only measure coverage on the version that uploads to Codecov
    - name: Test with pytest
      run: pytest -vvv --durations=20 ${{ matrix.python-version == '3.11' && '--cov-report=xml' || '--no-cov' }}

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11' && github.repository == 'EMMC-ASBL/tripper'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  pytest-no-extra-dependencies: # Test for basic version, without extras installed
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install minimal dependencies
      run: uv pip install --system -e .[testing-core]

    - name: Test with pytest, but without other extra dependencies
      run: pytest -vvv --durations=20 --no-cov tests/
