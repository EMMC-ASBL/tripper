name: CI - Tests

on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'push-action/**'  # Allow pushing to protected branches

# Cancel superseded runs on the same PR/branch (but never on master)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  basic-tests:
    name: External
    uses: SINTEF/ci-cd/.github/workflows/ci_tests.yml@v2.10.0
    with:
      ## General settings:
      install_extras: "[dev]"

      ## pre-commit
      run_pre-commit: false
      skip_pre-commit_hooks: "generate-context-and-doc"

      ## pylint & safety
      python_version_pylint_safety: "3.14"

      # pylint-specific settings
      run_pylint: true
      pylint_runs: |
        --rcfile=pyproject.toml tripper
        --rcfile=pyproject.toml --disable=import-outside-toplevel,redefined-outer-name tests

      # safety-specific settings
      run_safety: false

      ## Build package
      run_build_package: true
      python_version_package: "3.14"
      build_libs: flit
      build_cmd: flit build

      ## Build documentation
      run_build_docs: true
      python_version_docs: "3.14"
      warnings_as_errors: true
      use_mkdocs: true

      # mkdocs-specific settings
      update_python_api_ref: true
      update_docs_landing_page: true
      package_dirs: tripper

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Run Safety CLI to check for vulnerabilities
        uses: pyupio/safety-action@v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY2 }}
          args: --detailed-output # To always see detailed output from this action

  # Pull the Docker images of the test services once and store them with
  # actions/cache, such that the pytest jobs don't pull from Docker Hub,
  # whose rate limit for anonymous pulls may otherwise make CI fail.
  # The cache key changes when the image tags in compose.yaml change.
  docker-images:
    name: Cache Docker images for test services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Look up cached Docker images
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/docker-images.tar
        key: docker-images-${{ hashFiles('test-services/compose.yaml') }}
        lookup-only: true

    - name: Pull and save Docker images
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        images=$(docker compose -f test-services/compose.yaml config --images)
        for image in $images; do
          for attempt in 1 2 3 4 5; do
            docker pull "$image" && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "Pull of $image failed, retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
        done
        docker save -o ~/docker-images.tar $images

  pytest:
    needs: docker-images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Restore Docker images
      uses: actions/cache/restore@v6
      with:
        path: ~/docker-images.tar
        key: docker-images-${{ hashFiles('test-services/compose.yaml') }}
        fail-on-cache-miss: true

    - name: Load Docker images
      run: docker load -i ~/docker-images.tar

    - name: Start services
      run: |
        docker compose -f test-services/compose.yaml up -d --wait --pull never

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv pip install --system -e .[testing]

    - name: List installed packages
      run: uv pip freeze --system

    # The tripper cache holds e.g. the units table generated from EMMO,
    # which otherwise is downloaded and rebuilt in every job.
    # Not used on Python 3.11, which measures coverage, since the code
    # that creates the cache would otherwise not be covered.
    - name: Cache tripper data
      if: matrix.python-version != '3.11'
      uses: actions/cache@v6
      with:
        path: ~/.cache/tripper
        key: tripper-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tripper/units/**', 'tripper/context/**', 'pyproject.toml') }}

    # Only measure coverage on the version that uploads to Codecov
    - name: Test with pytest
      run: pytest -vvv --durations=20 ${{ matrix.python-version == '3.11' && '--cov-report=xml' || '--no-cov' }}

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11' && github.repository == 'EMMC-ASBL/tripper'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Show service logs
      if: failure()
      run: docker compose -f test-services/compose.yaml logs

    - name: Stop services
      if: always()
      run: docker compose -f test-services/compose.yaml down

  pytest-no-extra-dependencies: # Test for basic version, without extras installed
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install minimal dependencies
      run: uv pip install --system -e .[testing-core]

    - name: Test with pytest, but without other extra dependencies
      run: pytest -vvv --durations=20 --no-cov tests/
